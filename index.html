<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles/index.css" />
  <link rel="stylesheet" href="./styles/auth.css" />
  <title>Бронирование переговорных</title>
</head>
<body>

  <!-- ========== ЭКРАН ВХОДА ========== -->
  <div id="login-screen" class="login-screen" style="display:none;">
    <div class="login-card">
      <div class="login-logo">📅</div>
      <h1 class="login-title">Бронирование переговорных</h1>
      <p class="login-subtitle">Войдите в систему для продолжения</p>
      <form id="login-form" class="login-form">
        <div class="form-field">
          <label for="login-username">Логин</label>
          <input type="text" id="login-username" name="username" required autofocus autocomplete="username" />
        </div>
        <div class="form-field">
          <label for="login-password">Пароль</label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password" />
        </div>
        <div id="login-error" class="login-error"></div>
        <button type="submit" class="login-btn">Войти</button>
      </form>
    </div>
  </div>

  <!-- ========== ОСНОВНОЕ ПРИЛОЖЕНИЕ ========== -->
  <div id="app-screen" style="display:none;">
    <div class="top-bar">
      <div class="top-bar__left">
        <span class="top-bar__title">📅 Бронирование переговорных</span>
        <select id="room-filter" class="room-filter">
          <option value="all">Все залы</option>
        </select>
      </div>
      <div class="top-bar__right">
        <button id="admin-panel-btn" class="top-bar__btn" style="display:none;">👥 Сотрудники</button>
        <div id="user-info" class="user-info"></div>
        <button id="logout-btn" class="top-bar__btn" style="display:none;">Выйти</button>
      </div>
    </div>

    <div class="app">
      <div class="sidebar desktop-only">
        <div class="sidebar__logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 2v4" /><path d="M16 2v4" />
            <rect width="18" height="18" x="3" y="4" rx="2" />
            <path d="M3 10h18" />
          </svg>
          <span class="sidebar__title">Календарь ВКС</span>
        </div>
        <button class="button button--primary button--lg" data-event-create-button>Создать</button>
        <div class="mini-calendar" data-mini-calendar>
          <div class="mini-calendar__header">
            <time class="mini-calendar__date" data-mini-calendar-date></time>
            <div class="mini-calendar__controls">
              <button class="button button--icon button--secondary button--sm" data-mini-calendar-previous-button>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
              </button>
              <button class="button button--icon button--secondary button--sm" data-mini-calendar-next-button>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
              </button>
            </div>
          </div>
          <div class="mini-calendar__content">
            <ul class="mini-calendar__day-of-week-list">
              <li class="mini-calendar__day-of-week">ПН</li>
              <li class="mini-calendar__day-of-week">ВТ</li>
              <li class="mini-calendar__day-of-week">СР</li>
              <li class="mini-calendar__day-of-week">ЧТ</li>
              <li class="mini-calendar__day-of-week">ПТ</li>
              <li class="mini-calendar__day-of-week">СБ</li>
              <li class="mini-calendar__day-of-week">ВС</li>
            </ul>
            <ul class="mini-calendar__day-list" data-mini-calendar-day-list></ul>
          </div>
        </div>
      </div>

      <main class="main">
        <div class="nav">
          <button class="button button--icon button--secondary mobile-only" data-hamburger-button>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" />
            </svg>
          </button>
          <div class="nav__date-info">
            <div class="nav__controls">
              <button class="button button--secondary desktop-only" data-nav-today-button>Сегодня</button>
              <div class="nav__arrows">
                <button class="button button--icon button--secondary" data-nav-previous-button>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <button class="button button--icon button--secondary" data-nav-next-button>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
                </button>
              </div>
            </div>
            <time class="nav__date" data-nav-date></time>
          </div>
          <div class="select desktop-only">
            <select class="select__select" data-view-select>
              <option value="day">День</option>
              <option value="week">Неделя</option>
              <option value="month" selected>Месяц</option>
            </select>
          </div>
        </div>
        <div class="calendar" data-calendar></div>
      </main>
    </div>

    <button class="fab mobile-only" data-event-create-button>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 12h14" /><path d="M12 5v14" />
      </svg>
    </button>

    <!-- ========== ДИАЛОГ: ФОРМА СОБЫТИЯ ========== -->
    <dialog class="dialog" data-dialog="event-form">
      <form class="form" data-event-form>
        <div class="dialog__wrapper">
          <div class="dialog__header">
            <h2 class="dialog__title" data-dialog-title></h2>
            <button class="button button--icon button--secondary" type="button" data-dialog-close-button>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6 6 18" /><path d="m6 6 12 12" />
              </svg>
            </button>
          </div>
          <div class="dialog__content">
            <div class="form__fields">
              <input type="hidden" id="id" name="id" />

              <div class="form__field">
                <label class="form__label" for="title">Название</label>
                <input class="input input--fill" id="title" name="title" type="text" placeholder="Введите название мероприятия" required autofocus />
              </div>

              <div class="form__field">
                <label class="form__label" for="room">Переговорная</label>
                <select class="select select--fill" id="room" name="room_id" required>
                  <option value="">Выберите зал...</option>
                </select>
              </div>

              <div class="form__field">
                <label class="form__label" for="date">Дата</label>
                <input class="input input--fill" id="date" name="date" type="date" required />
              </div>

              <div class="form__split">
